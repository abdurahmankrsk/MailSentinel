# Test profile: H2 in Postgres-compatibility mode, so schema/locking behavior stays in
# parity with the real Supabase Postgres profile without needing any live network DB.
spring.datasource.url=jdbc:h2:mem:mailsentinel-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Sized up from the default (10) so the concurrency test exercises genuinely
# simultaneous DB access rather than being serialized by pool contention.
spring.datasource.hikari.maximum-pool-size=30
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

ai.provider.active=groq
ai.provider.groq.api-key=test-key
ai.provider.gemini.api-key=test-key

mailsentinel.admin.emails=admin@mailsentinel.test

# Rate limiting off by default here: most integration tests register several accounts
# or fire repeated logins from one address, which the production quotas exist to stop.
# The dedicated rate-limit tests switch it back on with their own explicit quotas, so
# the limiter is still covered -- just not imposed on tests about something else.
mailsentinel.rate-limit.enabled=false

# Mirrored from src/main/resources/application.properties, and it has to be.
# src/test/resources/application.properties shadows the main file entirely rather than
# merging with it -- Spring Boot loads the first application.properties on the classpath
# and test resources come first -- so 28 of the 39 production settings simply do not
# exist while the suite runs. Most fall back to identical @Value defaults and nobody
# notices. This one does not: without it a thrown ResponseStatusException's reason is
# dropped and the client gets a bare "Bad Request", so every test ran against a
# different error contract than the deployed app, and the frontend's parseErrorMessage
# -- written entirely around RFC 7807's `detail` -- had no coverage at all.
# ApiErrorContractTest is what keeps this honest.
spring.mvc.problemdetails.enabled=true
