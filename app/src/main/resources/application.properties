spring.application.name=mailsentinel
server.port=8080

# Logging: do not log request bodies (preserves in-memory privacy design)
logging.level.org.springframework.web=INFO

# Database (Supabase Postgres in real deployments) -- credentials come from env vars only,
# never hardcoded/committed. Not reachable until SPRING_DATASOURCE_* are set.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# AI providers -- keys are server-side only, read from env vars, never sent to the frontend.
ai.provider.active=groq
ai.provider.groq.api-key=${GROQ_API_KEY:}
ai.provider.groq.model=llama-3.3-70b-versatile
ai.provider.groq.base-url=https://api.groq.com/openai/v1
ai.provider.gemini.api-key=${GEMINI_API_KEY:}
ai.provider.gemini.model=gemini-2.5-flash-lite
ai.provider.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# AI finding validation -- caps on what an AI-returned finding can contribute to the score,
# see AiAnalysisService. Deliberately below the deterministic "solo-red" tier (55-70).
mailsentinel.ai.finding.max-weight=35
mailsentinel.ai.finding.max-count=4

# Auth
mailsentinel.auth.token-ttl=P30D
mailsentinel.admin.emails=${ADMIN_EMAILS:}

# Google sign-in -- the client ID is public by design (it identifies this app to Google
# and is visible in the browser). The ID-token flow used here needs no client secret at
# all, so none is read, stored, or sent to the frontend. Blank = Google sign-in is off
# and the frontend hides the button.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# Idempotency
mailsentinel.idempotency.abandoned-after=PT2M

# Plan configuration -- centralized, override-able without code changes (see PlanCatalog).
mailsentinel.plans.free.price-cents=0
mailsentinel.plans.free.ai-scans-per-month=0
mailsentinel.plans.premium.price-cents=300
mailsentinel.plans.premium.ai-scans-per-month=1000
