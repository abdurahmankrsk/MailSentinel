spring.application.name=mailsentinel
# PORT, not just SERVER_PORT: container platforms (Render, Railway, Fly, Heroku) assign a
# port and inject it as PORT, and Spring's relaxed binding does not map that name. Left as
# a bare 8080 the app ignored the assignment and bound the wrong port -- while the
# Dockerfile advertised ENV PORT=8080 as though it were wired up.
server.port=${PORT:8080}

# RFC 7807 error bodies -- without this, a thrown ResponseStatusException's reason
# (e.g. "That API key doesn't work: ...") never reaches the client: Boot's default
# error body omits the message for security and leaves only the generic HTTP phrase
# ("Bad Request"). The frontend's parseErrorMessage already reads body.detail for
# exactly this reason. Named exceptions routed through ApiExceptionHandler build their
# own ResponseEntity directly and are unaffected either way.
spring.mvc.problemdetails.enabled=true

# Logging: do not log request bodies (preserves in-memory privacy design)
logging.level.org.springframework.web=INFO

# Database (Supabase Postgres in real deployments) -- credentials come from env vars only,
# never hardcoded/committed. Not reachable until SPRING_DATASOURCE_* are set.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# AI providers -- keys are server-side only, read from env vars, never sent to the frontend.
ai.provider.active=groq
ai.provider.groq.api-key=${GROQ_API_KEY:}
ai.provider.groq.model=llama-3.3-70b-versatile
ai.provider.groq.base-url=https://api.groq.com/openai/v1
ai.provider.gemini.api-key=${GEMINI_API_KEY:}
ai.provider.gemini.model=gemini-2.5-flash-lite
ai.provider.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# AI finding validation -- caps on what an AI-returned finding can contribute to the score,
# see AiAnalysisService. Deliberately below the deterministic "solo-red" tier (55-70).
mailsentinel.ai.finding.max-weight=35
mailsentinel.ai.finding.max-count=4

# Auth
mailsentinel.auth.token-ttl=P30D
mailsentinel.admin.emails=${ADMIN_EMAILS:}

# Bring-your-own AI key -- lets a user supply their own AI API key (any
# OpenAI-compatible endpoint) instead of needing PREMIUM. Blank disables the
# feature entirely (see AiKeyCipher) rather than encrypting with a weak/empty secret.
mailsentinel.byok.encryption-key=${BYOK_ENCRYPTION_KEY:}
# The user's base URL is fetched server-side, so OutboundUrlGuard restricts it to
# public HTTPS addresses. Flipping this to true reaches loopback, RFC1918 and the
# cloud metadata service again -- only for a trusted-user deployment pointing the
# feature at a self-hosted model.
mailsentinel.byok.allow-private-endpoints=${BYOK_ALLOW_PRIVATE_ENDPOINTS:false}

# Google sign-in -- the client ID is public by design (it identifies this app to Google
# and is visible in the browser). The ID-token flow used here needs no client secret at
# all, so none is read, stored, or sent to the frontend. Blank = Google sign-in is off
# and the frontend hides the button.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# Idempotency
mailsentinel.idempotency.abandoned-after=PT2M

# Plan configuration -- centralized, override-able without code changes (see PlanCatalog).
mailsentinel.plans.free.price-cents=0
mailsentinel.plans.free.ai-scans-per-month=0
mailsentinel.plans.premium.price-cents=300
mailsentinel.plans.premium.ai-scans-per-month=1000

# Rate limiting -- abuse ceilings, not usage budgets (see RateLimitProperties).
# Counters are in-process: they reset on restart and each replica counts on its own,
# so this wants to move behind the datastore before running multi-instance.
mailsentinel.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# X-Forwarded-For is caller-supplied, so trusting it is opt-in: true only when a proxy
# that sets it sits in front (Render/Railway/Fly/Heroku do). Trusting it without one
# hands every request a fresh identity and disables the limiter; not trusting it behind
# one collapses every client into a single bucket. See ClientIpResolver.
mailsentinel.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
mailsentinel.rate-limit.login.limit=5
mailsentinel.rate-limit.login.window=PT15M
mailsentinel.rate-limit.register.limit=3
mailsentinel.rate-limit.register.window=PT1H
mailsentinel.rate-limit.scan.limit=60
mailsentinel.rate-limit.scan.window=PT1M
mailsentinel.rate-limit.ai-key.limit=5
mailsentinel.rate-limit.ai-key.window=PT1H
