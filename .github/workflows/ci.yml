name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/client/package-lock.json

      - name: Build Frontend Client
        working-directory: app/client
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Maven Tests & Package
        working-directory: app
        run: |
          chmod +x mvnw
          ./mvnw test
          ./mvnw package -DskipTests
